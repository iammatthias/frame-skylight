# Cap container log growth — json-file defaults to unbounded.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  skylight-icloud-sync:
    build: .
    image: skylight-icloud-sync
    container_name: skylight-icloud-sync
    logging: *default-logging
    # Host networking so adb reaches the frame on the LAN (frame:5555) and the
    # status endpoint binds straight onto the host (no published ports with host
    # net). Reachable at http://<host>:${STATUS_PORT}/status on the LAN/tailnet.
    network_mode: host
    environment:
      ALBUM_URL: "${ALBUM_URL}"                    # public Shared Album link
      FRAME_HOST: "${FRAME_HOST:-192.168.1.50:5555}"
      POLL_INTERVAL: "${POLL_INTERVAL:-300}"
      DRY_RUN: "${DRY_RUN:-}"                       # "1" to plan without writing
      STATUS_ADDR: "${STATUS_ADDR:-0.0.0.0}"
      STATUS_PORT: "${STATUS_PORT:-8780}"
    # The adb client key identifies this host to the frame. It lives in
    # ~/.android — the container's writable layer — so it is regenerated every
    # time the container is recreated. The frame accepts a new key without
    # prompting, so this is churn rather than a lockout, but a stable identity
    # is the right behavior and costs one line.
    volumes:
      - adb-key:/root/.android
    # adb raises its own soft fd limit to whatever the hard limit allows, then
    # fails every socketpair with EMFILE ("Too many open files") once that
    # ceiling is large — which is what a modern container runtime hands out by
    # default (524288 here). The symptom is `adb shell` failing instantly while
    # `adb devices` still reports a healthy device, so it reads like a frame
    # problem rather than an fd one. Pin a classic 1024 and adb behaves.
    ulimits:
      nofile:
        soft: 1024
        hard: 1024
    restart: unless-stopped

volumes:
  adb-key:
